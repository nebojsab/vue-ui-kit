name: Publish to npm

# Push a tag like v1.1.0 (matching package.json) to publish @nebojsab/vue-ui-kit to npm.
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret. Set it up once on npmjs.com →
# the package → Settings → Trusted Publisher → GitHub Actions: nebojsab / vue-ui-kit / publish.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC for trusted publishing (also signs provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24          # ships npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Types are up to date
        run: npm run build:types && git diff --exit-code src/index.d.ts
      - run: npm publish --access public

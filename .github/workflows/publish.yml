name: Publish package

# Push a tag like v1.2.0 (matching package.json) to publish @nebojsab/vue-ui-kit
# to GitHub Packages. Apps then bump the version they depend on.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@nebojsab'
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

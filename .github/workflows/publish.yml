name: Publish to npm

# Push a tag like v1.1.0 (matching package.json) to publish @nebojsab/vue-ui-kit to the
# public npm registry. Needs an npm automation token in the repo secret NPM_TOKEN.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Types are up to date
        run: npm run build:types && git diff --exit-code src/index.d.ts
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
